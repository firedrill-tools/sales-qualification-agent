name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --dev --locked
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync qualify-lead --help
      - run: uv run --no-sync qualify-lead --list-cases
      - run: uv build --wheel
      - run: uv run --no-sync python scripts/check_wheel.py
